<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Coverage — Network Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f3ee; --panel:#ffffff; --ink:#16150f; --muted:#6f6c5e;
    --line:#e3e1d6; --line-strong:#16150f;
    --accent:#ff2d6b;
    --bank:#4f46e5; --card:#e11d63; --ewallet:#d97706; --cash:#059669; --mobile:#0891b2; --crypto:#9333ea;
    --blocked:#9a9486;
    --shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 30px -18px rgba(0,0,0,.25);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(circle at 1px 1px, rgba(0,0,0,.035) 1px, transparent 0);
    background-size:22px 22px;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .brand h1{font-family:"Bricolage Grotesque";font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em;margin:0}
  .brand p{margin:7px 0 0;color:var(--muted);font-size:13.5px;max-width:46ch}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .tab{border:0;background:transparent;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;
       color:var(--muted);padding:8px 16px;border-radius:999px;letter-spacing:.01em;transition:.15s}
  .tab .n{font-weight:600;opacity:.6;margin-left:6px;font-size:12px}
  .tab[aria-selected="true"]{background:var(--ink);color:#fff}
  .tab[aria-selected="true"] .n{opacity:.7}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;font-family:inherit;font-size:14px;padding:11px 14px 11px 38px;border-radius:999px;
     border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none}
  .search input:focus{border-color:var(--line-strong)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
          background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 15px;user-select:none;white-space:nowrap}
  .toggle input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;margin:0}

  .layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}

  .list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
        max-height:72vh;overflow:auto}
  .list .grouphead{position:sticky;top:0;background:var(--panel);font-size:11px;font-weight:700;letter-spacing:.12em;
        text-transform:uppercase;color:var(--muted);padding:12px 16px 6px;border-bottom:1px solid var(--line)}
  .citem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;cursor:pointer;
        border-bottom:1px solid var(--line);font-size:14px;font-weight:500;transition:.12s}
  .citem:last-child{border-bottom:0}
  .citem:hover{background:#faf9f3}
  .citem[aria-selected="true"]{background:var(--ink);color:#fff}
  .citem .mini{display:flex;gap:3px}
  .citem .mini i{width:7px;height:7px;border-radius:2px;display:block}
  .citem.restricted{color:var(--blocked)}
  .citem.none{color:#b8b3a5}
  .citem.restricted[aria-selected="true"],.citem.none[aria-selected="true"]{color:#fff}
  .lock{font-size:11px}
  .empty{padding:24px 16px;color:var(--muted);font-size:13px}

  .detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
        min-height:420px;padding:26px 28px}
  .detail .place{font-family:"Bricolage Grotesque";font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1;margin:0}
  .detail .region-pill{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.1em;
        text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
  .rule{height:2px;background:var(--ink);margin:20px 0;border-radius:2px}
  .dir{margin-top:22px}
  .dir h3{font-family:"Bricolage Grotesque";font-weight:700;font-size:18px;margin:0 0 12px;letter-spacing:-.01em}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{color:#fff;font-weight:700;font-size:12px;letter-spacing:.02em;padding:8px 14px;border-radius:9px}
  .chip.bank{background:var(--bank)} .chip.card{background:var(--card)}
  .chip.ewallet{background:var(--ewallet)} .chip.cash{background:var(--cash)} .chip.mobile{background:var(--mobile)} .chip.crypto{background:var(--crypto)}
  .none{color:var(--muted);font-size:13px;font-style:italic}

  .methods{display:flex;flex-direction:column;gap:8px}
  .m{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fcfbf6}
  .m .tag{width:9px;height:34px;border-radius:4px;flex:none}
  .m .tag.bank{background:var(--bank)} .m .tag.card{background:var(--card)}
  .m .tag.ewallet{background:var(--ewallet)} .m .tag.cash{background:var(--cash)} .m .tag.mobile{background:var(--mobile)} .m .tag.crypto{background:var(--crypto)}
  .m .body{flex:1;min-width:0}
  .m .name{font-weight:700;font-size:14px}
  .m .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .m .psp{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
          border:1px solid var(--line);border-radius:6px;padding:4px 8px;white-space:nowrap}

  .blockbox{margin-top:22px;border:1.5px solid var(--accent);background:#fff0f5;border-radius:12px;padding:18px 20px}
  .blockbox .h{font-family:"Bricolage Grotesque";font-weight:800;font-size:16px;color:var(--accent);display:flex;align-items:center;gap:8px}
  .blockbox p{margin:8px 0 0;font-size:13.5px;color:#7a2540}
  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:380px;text-align:center;color:var(--muted)}
  .placeholder .big{font-family:"Bricolage Grotesque";font-weight:700;font-size:22px;color:var(--ink);margin-bottom:6px}
  .foot{margin-top:18px;font-size:11.5px;color:var(--muted)}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">

      <span><i class="dot" style="background:var(--cash)"></i>Cash</span>
      <span><i class="dot" style="background:var(--crypto)"></i>Crypto</span>

  </header>

  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

  </div>

  <div class="layout">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"></div>
  </div>
</div>

<script>
const TYPES = {bank:"Bank", card:"Cards", ewallet:"E-Wallet", mobile:"Mobile Money", cash:"Cash", crypto:"Crypto"};
const REGIONS = ["ALL","EMEA","APAC","AMERICAS"];
let activeRegion = "AMERICAS";
let activeCountry = null;
let query = "";
let showNames = false;

// ---- core resolution: license gate wins over everything ----
function resolve(iso){
  if(DATA.license[iso]) return {blocked:true, reason:DATA.license[iso].reason, payin:[], payout:[]};
  const payin=[], payout=[];
  for(const psp of DATA.psps){
    for(const off of psp.offerings){
      const listed = off.countries.includes(iso);
      const avail = off.mode==="include" ? listed : !listed;
      if(!avail) continue;
      const e={psp:psp.name, method:off.method, type:off.type, brand:off.brand||null, currencies:off.currencies||null};
      if(off.direction==="in"||off.direction==="both") payin.push(e);
      if(off.direction==="out"||off.direction==="both") payout.push(e);
    }
  }
  return {blocked:false, payin, payout};
}

// universe: countries with any offering OR license-blocked
const UNIVERSE = (()=>{
  const set = new Set(Object.keys(DATA.license));
  for(const psp of DATA.psps) for(const off of psp.offerings)
    for(const iso of off.countries) if(DATA.countries[iso]) set.add(iso);
  for(const iso of Object.keys(DATA.countries)){
    if(set.has(iso)) continue;
    const r=resolve(iso);
    if(r.payin.length||r.payout.length) set.add(iso);
  }
  return [...set];
})();

const RANK={served:0,restricted:1,none:2};
function classify(iso){
  if(DATA.license[iso]) return "restricted";
  const r=resolve(iso);
  return (r.payin.length||r.payout.length) ? "served" : "none";
}

function inRegion(iso,region){ return region==="ALL" || (DATA.countries[iso] && DATA.countries[iso].region===region); }
function countriesIn(region){
  return UNIVERSE
    .filter(iso => DATA.countries[iso] && inRegion(iso,region))
    .filter(iso => !query || DATA.countries[iso].name.toLowerCase().includes(query))
    .sort((a,b)=>DATA.countries[a].name.localeCompare(DATA.countries[b].name));
}

function regionCount(region){
  return UNIVERSE.filter(iso=>DATA.countries[iso]&&inRegion(iso,region)&&classify(iso)==="served").length;
}

// ---- rendering ----
function renderTabs(){
  const t=document.getElementById("tabs");
  t.innerHTML = REGIONS.map(r=>
    `<button class="tab" role="tab" aria-selected="${r===activeRegion}" data-r="${r}">${r==="ALL"?"All":r}<span class="n">${regionCount(r)}</span></button>`
  ).join("");
  t.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeRegion=b.dataset.r; renderList();});
}

function typeDots(iso){
  const r=resolve(iso);
  if(r.blocked) return `<span class="lock">🔒</span>`;
  const types=new Set([...r.payin,...r.payout].map(e=>e.type));
  if(!types.size) return `<span class="lock" style="opacity:.5">—</span>`;
  return `<span class="mini">`+["bank","card","ewallet","mobile","cash","crypto"].filter(t=>types.has(t))
    .map(t=>`<i style="background:var(--${t})"></i>`).join("")+`</span>`;
}

function renderList(){
  renderTabs();
  const list=document.getElementById("list");
  const items=countriesIn(activeRegion);
  if(!items.length){ list.innerHTML=`<div class="empty">No countries match “${query}”.</div>`; return; }
  const served=items.filter(i=>classify(i)==="served").length;
  const restr=items.filter(i=>classify(i)==="restricted").length;
  const none=items.filter(i=>classify(i)==="none").length;
  const parts=[`${served} served`]; if(restr)parts.push(`${restr} restricted`); if(none)parts.push(`${none} no coverage`);
  list.innerHTML =
    `<div class="grouphead">${activeRegion} · ${parts.join(" · ")}</div>`+
    items.map(iso=>{
      const cls=classify(iso);
      return `<div class="citem ${cls}" data-iso="${iso}" aria-selected="${iso===activeCountry}">
        <span>${DATA.countries[iso].name}</span>${typeDots(iso)}</div>`;
    }).join("");
  list.querySelectorAll(".citem").forEach(el=>el.onclick=()=>{activeCountry=el.dataset.iso; renderList(); renderDetail();});
}

const TYPE_ORDER={bank:0,card:1,ewallet:2,mobile:3,cash:4,crypto:5};
function chipRow(entries){
  const types=[...new Set(entries.map(e=>e.type))].sort((a,b)=>TYPE_ORDER[a]-TYPE_ORDER[b]);
  if(!types.length) return `<div class="none">No methods available.</div>`;
  return `<div class="chips">`+types.map(t=>`<span class="chip ${t}">${TYPES[t]}</span>`).join("")+`</div>`;
}

function methodRows(entries){
  if(!entries.length) return "";
  const order={bank:0,card:1,ewallet:2,mobile:3,cash:4,crypto:5};
  const seen=new Set(), uniq=[];
  for(const e of entries){const k=e.type+"|"+e.method; if(seen.has(k))continue; seen.add(k); uniq.push(e);}
  uniq.sort((a,b)=>(order[a.type]-order[b.type])||a.method.localeCompare(b.method));
  return `<div class="methods">`+uniq.map(e=>
    `<div class="m"><span class="tag ${e.type}"></span><div class="body"><div class="name">${e.method}</div></div></div>`
  ).join("")+`</div>`;
}

function renderDetail(){
  const d=document.getElementById("detail");
  if(!activeCountry){
    d.innerHTML=`<div class="placeholder"><div class="big">Select a country</div><div>Pick one from the list to see its payment coverage.</div></div>`;
    return;
  }
  const c=DATA.countries[activeCountry], r=resolve(activeCountry);
  let html=`<h2 class="place">${c.name}</h2><div class="region-pill">${c.region}</div>`;
  if(r.blocked){
    html+=`<div class="blockbox"><div class="h">🔒 Restricted</div>
      <p>${r.reason}. No payment methods can be offered here, regardless of provider availability.</p></div>`;
    d.innerHTML=html; return;
  }
  if(!r.payin.length && !r.payout.length){
    html+=`<div class="blockbox" style="border-color:var(--line);background:#faf9f3">
      <div class="h" style="color:var(--muted)">No coverage</div>
      <p style="color:var(--muted)">No provider currently offers pay-in or payout methods here. Not restricted by license — simply no coverage yet.</p></div>`;
    d.innerHTML=html; return;
  }
  html+=`<div class="rule"></div>`;
  html+=`<div class="dir"><h3>Payments <span style="color:var(--muted);font-weight:500;font-size:13px">(pay-in)</span></h3>${chipRow(r.payin)}${showNames?methodRows(r.payin):""}</div>`;
  html+=`<div class="dir"><h3>Payouts <span style="color:var(--muted);font-weight:500;font-size:13px">(pay-out)</span></h3>${chipRow(r.payout)}${showNames?methodRows(r.payout):""}</div>`;
  d.innerHTML=html;
}

document.getElementById("search").addEventListener("input",e=>{
  query=e.target.value.trim().toLowerCase();
  // jump to a region that has matches if current has none
  if(query && !countriesIn(activeRegion).length){
    const hit=REGIONS.find(r=>{const old=activeRegion;activeRegion=r;const n=countriesIn(r).length;activeRegion=old;return n;});
    if(hit) activeRegion=hit;
  }
  renderList();
});

document.getElementById("toggleNames").addEventListener("change",e=>{showNames=e.target.checked; renderDetail();});

renderList();
renderDetail();
</script>
